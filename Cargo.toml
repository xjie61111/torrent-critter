[package]
name = "torrent-client"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
librqbit = "9.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tray-icon = "0.27.0"
raw-window-handle = "0.6"

[build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_WindowsAndMessaging"] }
